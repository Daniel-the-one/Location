# Render Blueprint — Essivivi
# Déploie le site vitrine statique. Le backend Django peut être ajouté ensuite
# comme Web Service (voir la section commentée en fin de fichier).
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: essivivi-vitrine
    runtime: static
    staticPublishPath: ./web
    buildCommand: echo "Site statique pret"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400

